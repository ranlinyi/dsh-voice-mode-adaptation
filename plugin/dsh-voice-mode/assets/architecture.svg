<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="1160" height="780" font-family="Noto Sans CJK SC, Sarasa UI SC, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8b949e"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#3fb950"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#58a6ff"/></marker>
  </defs>
  <rect width="1160" height="780" fill="#0d1117"/>
  <text x="580" y="42" fill="#e6edf3" font-size="26" font-weight="800" text-anchor="middle">纯语音朗读 · 架构总览</text>

  <text x="70" y="88" fill="#58a6ff" font-size="18" font-weight="700">浏览器（client half）</text>
  <text x="630" y="88" fill="#3fb950" font-size="18" font-weight="700">宿主（host half）</text>

  <rect x="70" y="110" width="430" height="66" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="285" y="140" fill="#58a6ff" font-size="17" font-weight="700" text-anchor="middle">朗读总开关 ReadToggleButton</text>
  <text x="285" y="162" fill="#8b949e" font-size="13" text-anchor="middle">conversation.input.right</text>

  <rect x="70" y="192" width="430" height="66" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="285" y="222" fill="#58a6ff" font-size="17" font-weight="700" text-anchor="middle">消息朗读键 ReadMessageButton</text>
  <text x="285" y="244" fill="#8b949e" font-size="13" text-anchor="middle">conversation.chat.assistant-actions（每条回复）</text>

  <rect x="70" y="274" width="430" height="66" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="285" y="304" fill="#58a6ff" font-size="17" font-weight="700" text-anchor="middle">朗读状态条 ReadingStatusBar</text>
  <text x="285" y="326" fill="#8b949e" font-size="13" text-anchor="middle">字幕 + 停止（conversation.input.dock）</text>

  <rect x="70" y="372" width="430" height="86" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="285" y="404" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">EventSource /stream</text>
  <text x="285" y="428" fill="#8b949e" font-size="13" text-anchor="middle">read（自动朗读归属） · audio · tts-error</text>

  <rect x="70" y="474" width="430" height="100" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="285" y="506" fill="#3fb950" font-size="17" font-weight="700" text-anchor="middle">Web Audio 播放引擎</text>
  <text x="285" y="530" fill="#8b949e" font-size="13" text-anchor="middle">按句拼帧 → 解码 → 链式调度（句间无缝）</text>
  <text x="285" y="554" fill="#8b949e" font-size="13" text-anchor="middle">帧 gen 变化 → engine.skip() 停旧播新</text>

  <rect x="70" y="590" width="430" height="66" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="285" y="620" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">仅播放当前查看会话</text>
  <text x="285" y="642" fill="#8b949e" font-size="13" text-anchor="middle">切换会话即停播</text>

  <rect x="630" y="110" width="460" height="86" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="860" y="142" fill="#3fb950" font-size="17" font-weight="700" text-anchor="middle">HTTP 端点（回环 + Origin + 限流）</text>
  <text x="860" y="168" fill="#8b949e" font-size="13" text-anchor="middle">/read · /speak · /cancel · /stream · /config</text>
  <text x="860" y="186" fill="#8b949e" font-size="13" text-anchor="middle">/preview · /voices · /models/{status,download,clean}</text>

  <rect x="630" y="212" width="460" height="96" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="860" y="244" fill="#58a6ff" font-size="17" font-weight="700" text-anchor="middle">llm/stream 无损 tap</text>
  <text x="860" y="268" fill="#8b949e" font-size="13" text-anchor="middle">仅自动朗读会话被观察，其余直达</text>
  <text x="860" y="290" fill="#8b949e" font-size="13" text-anchor="middle">新回合先 queue.cancel(sid)（需求 2）</text>

  <rect x="630" y="324" width="460" height="90" rx="12" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="860" y="356" fill="#a371f7" font-size="17" font-weight="700" text-anchor="middle">SpeechAdapter（语音改编站 · 可选）</text>
  <text x="860" y="380" fill="#8b949e" font-size="13" text-anchor="middle">公式 / 表格 / 代码 → 口播稿</text>
  <text x="860" y="400" fill="#8b949e" font-size="13" text-anchor="middle">关闭时完全退化为「原文 → 清洗 → 分句」</text>

  <rect x="630" y="430" width="460" height="84" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="860" y="462" fill="#d29922" font-size="17" font-weight="700" text-anchor="middle">TtsQueue：逐会话队列 + epoch</text>
  <text x="860" y="486" fill="#8b949e" font-size="13" text-anchor="middle">cancel → epoch++；帧携带 gen</text>

  <rect x="630" y="530" width="460" height="70" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="860" y="562" fill="#d29922" font-size="17" font-weight="700" text-anchor="middle">TTS 引擎：Edge / VITS / Kokoro / Azure</text>
  <text x="860" y="584" fill="#8b949e" font-size="13" text-anchor="middle">音色 / 语速设置即时生效</text>

  <rect x="630" y="616" width="460" height="70" rx="12" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="860" y="648" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">models.ts：懒下载 + 断点续传 + SHA256</text>
  <text x="860" y="670" fill="#8b949e" font-size="13" text-anchor="middle">下载域名白名单 + 校验失败 fail-loud</text>

  <line x1="500" y1="300" x2="626" y2="300" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="563" y="292" fill="#3fb950" font-size="13" text-anchor="middle">POST /read</text>
  <text x="563" y="318" fill="#3fb950" font-size="13" text-anchor="middle">/speak · /cancel</text>

  <line x1="626" y1="420" x2="500" y2="420" stroke="#58a6ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="563" y="412" fill="#58a6ff" font-size="13" text-anchor="middle">SSE audio 帧</text>
  <text x="563" y="438" fill="#58a6ff" font-size="13" text-anchor="middle">read · tts-error</text>

  <line x1="860" y1="196" x2="860" y2="208" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="308" x2="860" y2="320" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="414" x2="860" y2="426" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="514" x2="860" y2="526" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="860" y1="600" x2="860" y2="612" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <text x="40" y="746" fill="#8b949e" font-size="14">纯朗读版 v0.9.0-tts-only.1：无语音输入、无 ASR、无录音；屏幕 Markdown / LaTeX 渲染完全不受影响。</text>
</svg>